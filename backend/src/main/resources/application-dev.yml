spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/callsagents
    username: callsagents
    password: callsagents
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
  # Dev keeps the admin seed (db/migration/dev), production does not.
  flyway:
    locations: classpath:db/migration,classpath:db/migration/dev