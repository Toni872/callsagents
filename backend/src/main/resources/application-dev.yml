spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/callsagents
    username: callsagents
    password: callsagents
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
  # Dev keeps the admin seed (db/migration/dev), production does not.
  flyway:
    locations: classpath:db/migration,classpath:db/migration/dev

app:
  cors:
    # Dev: ng serve (4200) y frontend docker (puerto 80). Vacío en producción (same-origin vía nginx).
    allowed-origins: http://localhost:4200,http://localhost:80,http://localhost