spring:
  application:
    name: callsagents-backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    # Production excludes the dev-only admin seed (V2 moved to db/migration/dev).
    # The seed was already applied to existing databases, so ignore the
    # 'missing' migration there instead of failing validation.
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing"
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  # Database: prefer Railway's DATABASE_URL when available, else build from
  # individual PG* env vars (Railway Postgres plugin sets PGUSER/PGPASSWORD).
  # The 'jdbc:' prefix is mandatory for spring.datasource.url; we prepend it.
  datasource:
    url: jdbc:${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:callsagents}}
    username: ${PGUSER:callsagents}
    password: ${PGPASSWORD:callsagents}
  # Redis: prefer Railway's REDIS_URL when available (format: redis://default:password@host:port).
  # Spring Boot 3+ accepts this URL via spring.data.redis.url directly.
  data:
    redis:
      url: ${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}
      timeout: 2000ms
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

app:
  # Base URL of the SPA so OAuth callbacks can redirect the browser back to it.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost}
  cors:
    # Comma-separated origins for the chat widget. In dev, application-dev.yml adds localhost.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://script-9.com,https://www.script-9.com}
  # AES-256-GCM master key for OAuth tokens at rest (calendar integrations).
  # Any length works — SHA-256 derives the AES key. REQUIRED for calendar sync.
  encryption:
    key: ${ENCRYPTION_KEY:}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    issuer: callsagents-backend
  calendar:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/calendar/integrations/google/callback}
    outlook:
      client-id: ${OUTLOOK_CLIENT_ID:}
      client-secret: ${OUTLOOK_CLIENT_SECRET:}
  voice:
    vapi:
      api-key: ${VAPI_API_KEY:}
      assistant-id: ${VAPI_ASSISTANT_ID:}
      phone-number-id: ${VAPI_PHONE_NUMBER_ID:}
      webhook-url: ${VAPI_WEBHOOK_URL:http://localhost:8080/api/voice/webhook/vapi}
      # Shared secret Vapi sends in the X-Vapi-Secret header. REQUIRED: without
      # it Vapi webhooks are rejected (fail closed).
      webhook-secret: ${VAPI_WEBHOOK_SECRET:}
    retell:
      api-key: ${RETELL_API_KEY:}
      agent-id: ${RETELL_AGENT_ID:}
      from-number: ${RETELL_FROM_NUMBER:}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    whatsapp:
      from: ${TWILIO_WHATSAPP_FROM:}
      to: ${TWILIO_WHATSAPP_TO:}
  vonage:
    api:
      key: ${VONAGE_API_KEY:}
      secret: ${VONAGE_API_SECRET:}
    sandbox:
      number: ${VONAGE_SANDBOX_NUMBER:}
      url: ${VONAGE_SANDBOX_URL:https://messages-sandbox.nexmo.com/v1/messages}
  groq:
    api:
      key: ${GROQ_API_KEY:}
      url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
    model: ${GROQ_MODEL:openai/gpt-oss-20b}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  # Railway injects PORT dynamically; forward the real port to Spring.
  # (Spring Boot reads server.port directly; the placeholder above lets Railway override.)

springdoc:
  api-docs:
    path: /v3/api-docs
    # Off in production (SPRINGDOC_ENABLED=false) so the API contract is not public.
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    enabled: ${SPRINGDOC_ENABLED:true}
  show-actuator: false

logging:
  level:
    root: INFO
    com.callsagents: INFO
    org.hibernate.SQL: INFO
