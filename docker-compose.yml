name: callsagents

services:
  postgres:
    image: postgres:16-alpine
    container_name: callsagents-postgres
    environment:
      POSTGRES_DB: callsagents
      POSTGRES_USER: callsagents
      POSTGRES_PASSWORD: callsagents
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callsagents"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - callsagents-net

  redis:
    image: redis:7-alpine
    container_name: callsagents-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - callsagents-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: callsagents-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/callsagents
      SPRING_DATASOURCE_USERNAME: callsagents
      SPRING_DATASOURCE_PASSWORD: callsagents
      # Use URL form so it wins over the `spring.data.redis.url` placeholder
      # in application.yml (which would otherwise default to localhost).
      SPRING_DATA_REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-bytes-please}
      # AES master key for encrypting OAuth tokens at rest (calendar integrations)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Google Calendar OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/calendar/integrations/google/callback}
      # Voice webhooks
      VAPI_WEBHOOK_SECRET: ${VAPI_WEBHOOK_SECRET}
      # Vapi integration (outbound calls)
      VAPI_API_KEY: ${VAPI_API_KEY}
      VAPI_ASSISTANT_ID: ${VAPI_ASSISTANT_ID:-}
      VAPI_PHONE_NUMBER_ID: ${VAPI_PHONE_NUMBER_ID:-}
      # Retell integration (outbound calls)
      RETELL_API_KEY: ${RETELL_API_KEY}
      RETELL_AGENT_ID: ${RETELL_AGENT_ID:-}
      RETELL_FROM_NUMBER: ${RETELL_FROM_NUMBER:-}
      # Twilio WhatsApp integration (sandbox)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM}
      TWILIO_WHATSAPP_TO: ${TWILIO_WHATSAPP_TO}
      # Swagger/OpenAPI (off in production)
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-true}
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - callsagents-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: callsagents-frontend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8080"
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
    networks:
      - callsagents-net

volumes:
  postgres_data:
  redis_data:

networks:
  callsagents-net:
    driver: bridge
