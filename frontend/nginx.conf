server {
    # Railway injects PORT at runtime and routes traffic to it. In dev
    # (docker compose) the Dockerfile entrypoint defaults PORT to 80.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression (must be at server level)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/javascript text/javascript image/svg+xml;

    # Reverse proxy to backend.
    location /api/ {
        proxy_pass ${BACKEND_SCHEME}://${BACKEND_HOST}:${BACKEND_PORT}/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host ${BACKEND_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Strip Origin so backend CORS doesn't block same-origin proxy requests
        proxy_set_header Origin "";

        # Timeout for backend calls
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Angular SPA: serve index.html for any non-asset route.
    location / {
        # Security headers (must be here — nginx does NOT inherit from server
        # when the location block has its own add_header)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Permissions-Policy: allow microphone for the widget (WebRTC voice call
        # needs it). The widget is served from the same origin (iframe at /widget),
        # so microphone=(self) grants mic to this origin only. Camera and
        # geolocation remain blocked.
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        # CRITICAL for Google Identity Services popup flow
        add_header Cross-Origin-Opener-Policy "unsafe-none" always;
        add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        # No caching on SPA shell
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "unsafe-none" always;
        add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
