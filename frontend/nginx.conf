server {
    # Railway injects PORT at runtime and routes traffic to it. In dev
    # (docker compose) the Dockerfile entrypoint defaults PORT to 80.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy to backend.
    # In production (Railway), BACKEND_HOST/BACKEND_PORT point at the backend
    # service (https://callsagents-production.up.railway.app:443) because the
    # private railway.internal network does not route between app services.
    # In dev (docker compose), defaults are 'backend' / 8080 over http.
    # The template only uses plain ${VAR} placeholders because envsubst does
    # not support ${VAR:default} syntax.
    location /api/ {
        proxy_pass ${BACKEND_SCHEME}://${BACKEND_HOST}:${BACKEND_PORT}/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA: serve index.html for any non-asset route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
