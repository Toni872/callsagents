server {
    # Railway injects PORT at runtime and routes traffic to it. In dev
    # (docker compose) the Dockerfile entrypoint defaults PORT to 80.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy to backend.
    # In production (Railway), BACKEND_HOST and BACKEND_PORT are set to the
    # internal Railway hostname (e.g. callsagents.railway.internal) and port.
    # In dev (docker compose), the Dockerfile entrypoint defaults them to
    # 'backend' / 8080. The template only uses plain ${VAR} placeholders
    # because envsubst does not support ${VAR:default} syntax.
    location /api/ {
        proxy_pass http://${BACKEND_HOST}:${BACKEND_PORT}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA: serve index.html for any non-asset route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
